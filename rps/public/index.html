<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors — LAN</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>✊✋✌️ Rock Paper Scissors</h1>
      <p id="connection" class="status">Connecting…</p>
    </header>

    <!-- Join -->
    <section id="join-screen" class="card hidden">
      <h2>Join the game</h2>
      <div class="field">
        <input id="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
        <button id="join-btn">Join</button>
      </div>
      <p id="join-error" class="error"></p>
    </section>

    <!-- Lobby -->
    <section id="lobby-screen" class="card hidden">
      <h2>Lobby</h2>
      <div id="host-lobby" class="hidden">
        <div class="field">
          <label for="target-input">First to</label>
          <input id="target-input" type="number" min="1" max="20" value="5" />
          <label>points wins</label>
        </div>
        <button id="start-btn">Start match</button>
        <p class="hint">Need at least 2 players. Each round you earn a point for every opponent your throw beats.</p>
      </div>
      <p id="wait-host" class="hint hidden">Waiting for the host to start…</p>
      <ul id="lobby-players" class="player-list"></ul>
    </section>

    <!-- Playing -->
    <section id="play-screen" class="hidden">
      <div class="card status-card">
        <div id="round-label" class="round-label"></div>
        <p id="phase-hint" class="hint"></p>
      </div>

      <div id="choices" class="card choices">
        <button class="throw" data-choice="rock"><span class="emoji">✊</span><span>Rock</span></button>
        <button class="throw" data-choice="paper"><span class="emoji">✋</span><span>Paper</span></button>
        <button class="throw" data-choice="scissors"><span class="emoji">✌️</span><span>Scissors</span></button>
      </div>

      <div class="card">
        <div class="field between">
          <h2>Scoreboard</h2>
          <button id="next-btn" class="hidden">Next round</button>
        </div>
        <ul id="scoreboard" class="player-list"></ul>
      </div>

      <div class="card">
        <h2>Log</h2>
        <ul id="log" class="log"></ul>
      </div>
    </section>

    <!-- Game over -->
    <section id="over-screen" class="hidden">
      <div class="card over-card">
        <h2 id="winner-text"></h2>
        <button id="again-btn" class="hidden">Back to lobby</button>
      </div>
      <div class="card">
        <h2>Final scores</h2>
        <ul id="final-scoreboard" class="player-list"></ul>
      </div>
    </section>
  </div>
  <script src="/client.js"></script>
</body>
</html>
