<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bananagrams — LAN</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🍌 Bananagrams</h1>
      <p id="connection" class="status">Connecting…</p>
    </header>

    <!-- Join -->
    <section id="join-screen" class="card hidden">
      <h2>Join the table</h2>
      <div class="field">
        <input id="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
        <button id="join-btn">Join</button>
      </div>
      <p id="join-error" class="error"></p>
    </section>

    <!-- Lobby -->
    <section id="lobby-screen" class="card hidden">
      <h2>Lobby</h2>
      <button id="start-btn" class="hidden">Split! (start)</button>
      <p id="wait-host" class="hint hidden">Waiting for the host to start…</p>
      <p class="hint">2–4 players draw 21 tiles each · 5–6 draw 15 · 7–8 draw 11.</p>
      <ul id="lobby-players" class="player-list"></ul>
    </section>

    <!-- Game -->
    <section id="game-screen" class="hidden">
      <div class="card toolbar">
        <div class="bunch">🍌 Bunch: <b id="bunch-count">0</b></div>
        <div class="actions">
          <button id="peel-btn">Peel / Bananas</button>
          <button id="dump-btn" class="secondary">Dump selected</button>
          <button id="recall-all-btn" class="secondary">Recall all</button>
        </div>
      </div>

      <p id="status-line" class="hint"></p>

      <div class="card board-card">
        <div id="board" class="board"></div>
      </div>

      <div class="card">
        <div class="field between">
          <h2>Your tiles (<span id="rack-count">0</span>)</h2>
          <span class="hint">Click a tile, then a cell to place. Click a placed tile to pick it up.</span>
        </div>
        <div id="rack" class="rack"></div>
      </div>

      <div class="card">
        <h2>Players</h2>
        <ul id="players" class="player-list"></ul>
      </div>

      <div class="card">
        <h2>Log</h2>
        <ul id="log" class="log"></ul>
      </div>
    </section>

    <!-- Verify / game over -->
    <section id="verify-screen" class="hidden">
      <div class="card">
        <h2 id="verify-title"></h2>
        <p id="verify-detail" class="hint"></p>
        <div id="host-verify" class="field hidden">
          <button id="confirm-btn">Confirm win 🎉</button>
          <button id="rotten-btn" class="danger">Rotten banana</button>
        </div>
        <div id="host-gameover" class="field hidden">
          <button id="lobby-btn">Back to lobby</button>
        </div>
        <div id="reveal-board" class="board reveal"></div>
      </div>
    </section>
  </div>
  <script src="/client.js"></script>
</body>
</html>
